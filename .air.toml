root = "."
tmp_dir = "/tmp/hogedd-api-air"

[build]
cmd = "go build -o /tmp/hogedd-api-air/server ./cmd/server"
entrypoint = ["/tmp/hogedd-api-air/server"]
include_ext = ["go"]
exclude_dir = [".git", "tmp", "vendor"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
