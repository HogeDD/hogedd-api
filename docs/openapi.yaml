openapi: 3.1.0
info:
  title: HogeDD API
  version: 1.0.0
servers:
  - url: https://api.hogedd.com
paths:
  /health:
    get:
      summary: 稼働確認
      responses:
        "200":
          description: リクエストを処理可能
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
    head:
      summary: 稼働確認（本文なし）
      responses:
        "200":
          description: リクエストを処理可能
  /v1/apps:
    get:
      summary: 公開済みアプリ一覧
      responses:
        "200":
          description: 公開済みアプリを配列で返す
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublishedApp"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      summary: 公開済みアプリ一覧の状態確認（本文なし）
      responses:
        "200":
          description: 取得可能
        "500":
          description: サーバーエラー
  /v1/apps/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: アプリを識別する小文字英数字とハイフンの文字列
    get:
      summary: 公開済みアプリを1件取得
      responses:
        "200":
          description: 公開済みアプリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedApp"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      summary: 公開済みアプリの状態確認（本文なし）
      responses:
        "200":
          description: 取得可能
        "404":
          description: 存在しないか未公開
        "500":
          description: サーバーエラー
  /v1/me:
    get:
      summary: 現在の認証主体を取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auth0で検証済みの認証主体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      summary: 現在の認証主体を取得可能か確認（本文なし）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得可能
        "401":
          description: Access Tokenがないか無効
  /v1/users/me:
    get:
      summary: 現在のHogeDD Userを取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 認証主体に紐づく登録済みUser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 認証主体に紐づくUserが未登録
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      summary: 現在のHogeDD Userを取得可能か確認
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得可能
        "401":
          description: Access Tokenがないか無効
        "404":
          description: 認証主体に紐づくUserが未登録
    put:
      summary: 現在の認証主体をHogeDD Userとして登録
      description: 初回はmemberとして作成し、登録済みの場合はroleとstatusを維持してemail snapshotを更新する。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 登録済みUserの連絡先snapshotを更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: Userを新規登録
          headers:
            Location:
              schema:
                type: string
                const: /v1/users/me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: request bodyが指定されている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: GET・HEAD・PUT以外のHTTP method
          headers:
            Allow:
              schema:
                type: string
                const: GET, HEAD, PUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Auth0 user profileを取得できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthenticatedIdentity:
      type: object
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          format: uri
        subject:
          type: string
    User:
      type: object
      required: [id, email, email_verified, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublishedApp:
      type: object
      required: [slug, title, description, status, published_at, tags, development_drive, youtube_url]
      properties:
        slug:
          type: string
          example: clean-tasks
        title:
          type: string
          example: Clean Tasks
        description:
          type: string
        status:
          type: string
          const: published
        published_at:
          type: string
          format: date-time
          example: 2026-05-30T00:00:00Z
        tags:
          type: array
          items:
            type: string
        development_drive:
          type: string
        youtube_url:
          type: string
          format: uri
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    Unauthorized:
      description: Access Tokenがないか無効
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AppNotFound:
      description: 存在しないか未公開
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
